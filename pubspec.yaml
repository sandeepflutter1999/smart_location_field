name: smart_location_field
description: "A TextFormField that doubles as a Google Places search box: country, state, city or normal location search, with suggestions and lat/lng."
version: 0.3.1
homepage: https://github.com/sandeepflutter1999/smart_location_field
repository: https://github.com/sandeepflutter1999/smart_location_field
issue_tracker: https://github.com/sandeepflutter1999/smart_location_field/issues

topics:
  - location
  - google-places
  - autocomplete
  - textfield
  - forms

screenshots:
  - description: 'Location search suggestions'
    path: screenshots/location.png
  - description: 'Location search demo'
    path: screenshots/location_search.gif
  - description: 'Email and password validation'
    path: screenshots/validation.gif
  - description: 'Email and password fields'
    path: screenshots/email_password.png
  - description: 'Outlined style field'
    path: screenshots/style_outlined.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  smart_api: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter: